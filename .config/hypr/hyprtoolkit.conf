# ~/.config/hypr/hyprtoolkit.conf
# Gruber Darker theme for hyprtoolkit / hyprlauncher
# Palette sourced from: https://github.com/rexim/gruber-darker-theme
#
# Colors use 0xFFRRGGBB format (FF = fully opaque)
#
# Gruber Darker palette reference:
#   bg-1     #101010   darkest background
#   bg       #181818   main background
#   bg+1     #282828   lighter background
#   bg+2     #453d41   selection / highlight
#   fg       #e4e4ef   main foreground
#   fg+1     #f4f4ff   bright foreground
#   yellow   #ffdd33   signature accent (keywords, highlights)
#   green    #73c936   secondary accent (strings)
#   niagara  #96a6c8   blue
#   wisteria #9e95c7   purple
#   quartz   #95a99f   cyan

background      = 0xFF181818   # bg       - main window background
base            = 0xFF282828   # bg+1     - widget / list background
alternate_base  = 0xFF453d41   # bg+2     - selected item background
text            = 0xFFe4e4ef   # fg       - regular text
bright_text     = 0xFFf4f4ff   # fg+1     - highlighted / focused text
accent          = 0xFFffdd33   # yellow   - search bar, focus ring
accent_secondary = 0xFF73c936  # green    - secondary highlights

font_size       = 13
h1_size         = 19
h2_size         = 15
h3_size         = 13
small_font_size = 11
